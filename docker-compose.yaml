services:
  hyperion:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@memory:6379/0
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [public, memory]
    depends_on:
      memory:
        condition: service_healthy

  # The HYPER-AI IDE (from the README's prerequisites), so the whole stack starts
  # with one `docker compose up`. The agent reaches the backend through the
  # published port (IDE_BACKEND_URL=http://host.docker.internal:3001/api).
  ide-backend:
    image: donmichael/ide-backend:latest
    environment:
      AUTH_ENABLED: "false"
    ports:
      - "3001:3001"
    networks: [public]
    restart: unless-stopped

  ide-gui:
    image: donmichael/ide-gui:latest
    ports:
      - "5000:80"
    networks: [public]
    depends_on: [ide-backend]
    restart: unless-stopped

  # Session memory. No published ports: reachable only by the agent, over the
  # internal network, with a password. Data survives restarts in a volume.
  memory:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - CONFIG
      - ""
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15
    volumes:
      - memory-data:/data
    networks: [memory]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    # Run as the image's redis user (uid 999) from the start, never as root. As root
    # with capabilities dropped, the entrypoint's chown of /data fails once Redis has
    # written its data, and the container crash-loops on every restart.
    user: "999:999"
    cap_drop: [ALL]
    restart: unless-stopped

networks:
  public: {}
  memory:
    internal: true  # no route to the host or the internet

volumes:
  memory-data: {}
