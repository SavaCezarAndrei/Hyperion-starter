services:
  hyperion:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@memory:6379/0
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [public, memory]
    depends_on:
      memory:
        condition: service_healthy

  # Session memory. No published ports: reachable only by the agent, over the
  # internal network, with a password. Data survives restarts in a volume.
  memory:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - CONFIG
      - ""
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15
    volumes:
      - memory-data:/data
    networks: [memory]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    restart: unless-stopped

networks:
  public: {}
  memory:
    internal: true  # no route to the host or the internet

volumes:
  memory-data: {}
