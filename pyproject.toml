[project]
name = "hyperion-starter"
version = "0.1.0"
description = "An agentic microservice for the HyperAI IDE"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.1",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "docx2txt>=0.9",
    "pytest>=9.1.1",
]
